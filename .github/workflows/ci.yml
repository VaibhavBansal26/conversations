name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            server/package-lock.json
            web/package-lock.json
      - run: npm ci --prefix server
      - run: npm ci --prefix web
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: End-to-end smoke (built server, real sockets)
        run: npm run e2e

  docker:
    runs-on: ubuntu-latest
    needs: verify
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t conversations:ci .
      - name: Boot and probe
        run: |
          docker run -d --name conv -p 3000:3000 -e JWT_SECRET=ci-secret-ci-secret-ci-secret conversations:ci
          for i in $(seq 1 30); do curl -fsS http://localhost:3000/healthz && exit 0; sleep 1; done
          docker logs conv
          exit 1
