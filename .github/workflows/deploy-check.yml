name: deploy-check
# Manual: confirms a deployed Conversations instance is up. Actions > deploy-check > Run workflow.
# Uses the repo variable APP_URL (Settings > Secrets and variables > Actions > Variables) unless you pass a url.
on:
  workflow_dispatch:
    inputs:
      url:
        description: Base URL to check (defaults to the APP_URL variable)
        required: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for the service (free instances sleep and take about a minute to wake)
        env:
          BASE: ${{ inputs.url || vars.APP_URL }}
        run: |
          test -n "$BASE" || { echo "Set the APP_URL variable or pass a url"; exit 1; }
          for i in $(seq 1 24); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$BASE/healthz" || true)
            echo "attempt $i: /healthz -> $code"
            [ "$code" = "200" ] && break
            sleep 10
          done
          [ "$code" = "200" ] || exit 1
          echo "/readyz -> $(curl -s -o /dev/null -w '%{http_code}' --max-time 20 "$BASE/readyz")"
          curl -sf --max-time 20 "$BASE/" -o /dev/null && echo "web app served"
