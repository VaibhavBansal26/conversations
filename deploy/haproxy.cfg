# HAProxy alternative to nginx. Same goals: long-lived websockets, graceful removal of draining nodes, stickiness for polling fallback.
global
  maxconn 200000
  log stdout format raw local0

defaults
  mode http
  log global
  timeout connect 5s
  timeout client  60s
  timeout server  60s
  # websocket / long-poll tunnels: must outlive Socket.IO ping interval + timeout (45s)
  timeout tunnel  2h
  timeout client-fin 5s
  option forwardfor
  option http-server-close

frontend fe
  bind :80
  # Docker/K8s health: HAProxy marks a node DOWN as soon as /readyz returns 503 (set during drain), so no new connections land on it
  default_backend app

backend app
  balance source           # sticky by client IP, only needed for the polling fallback
  hash-type consistent
  option httpchk GET /readyz
  http-check expect status 200
  default-server check inter 2s fall 2 rise 2 on-marked-down shutdown-sessions=false
  server app1 app1:3000
  server app2 app2:3000
