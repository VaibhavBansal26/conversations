# nginx in front of N Conversations nodes. Used by docker-compose.yml; also a template for bare-metal.
# Key points for WebSockets (all explained in docs/SCALING.md):
#  - Upgrade/Connection headers must be forwarded explicitly
#  - proxy_read_timeout must exceed the Socket.IO ping interval + timeout (25s + 20s) by a wide margin, or nginx kills idle sockets
#  - proxy_buffering off for the event stream; no gzip on the websocket path
#  - stickiness only matters for the HTTP long-polling fallback (a polling session must reach the same node); clients that start on
#    "websocket" never need it. ip_hash keeps polling clients sticky without cookies.
worker_processes auto;
worker_rlimit_nofile 200000;
events {
  worker_connections 65535;
  multi_accept on;
}

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile on;
  tcp_nopush on;
  keepalive_timeout 65;
  server_tokens off;

  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # real client IP: trust the Docker/LB network only. If Cloudflare is in front, the app (not nginx) decides about CF-Connecting-IP
  # via the shared-secret header; see docs/CLOUDFLARE.md. Do NOT enable real_ip_header CF-Connecting-IP here without allow-listing Cloudflare ranges.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;

  upstream conversations {
    ip_hash;
    server app1:3000 max_fails=2 fail_timeout=5s;
    server app2:3000 max_fails=2 fail_timeout=5s;
    keepalive 64;
  }

  limit_conn_zone $binary_remote_addr zone=perip:10m;
  limit_req_zone  $binary_remote_addr zone=perip_req:10m rate=50r/s;

  server {
    listen 80 reuseport;
    client_max_body_size 12m;

    # a draining node answers /readyz with 503 and ip_hash+max_fails removes it quickly; new sockets go elsewhere
    location /socket.io/ {
      proxy_pass http://conversations;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 120s;
      proxy_send_timeout 120s;
      proxy_buffering off;
      proxy_next_upstream error timeout;
      limit_conn perip 200;
    }

    location /metrics {
      # scraped inside the private network only
      allow 10.0.0.0/8; allow 172.16.0.0/12; allow 192.168.0.0/16; allow 127.0.0.1; deny all;
      proxy_pass http://conversations;
    }

    location / {
      proxy_pass http://conversations;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
      limit_req zone=perip_req burst=100 nodelay;
    }
  }
}
