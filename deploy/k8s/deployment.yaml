apiVersion: apps/v1
kind: Deployment
metadata: { name: conversations, labels: { app: conversations } }
spec:
  replicas: 2
  strategy: { type: RollingUpdate, rollingUpdate: { maxSurge: 1, maxUnavailable: 0 } }
  selector: { matchLabels: { app: conversations } }
  template:
    metadata:
      labels: { app: conversations }
      annotations: { prometheus.io/scrape: "true", prometheus.io/port: "3000", prometheus.io/path: /metrics }
    spec:
      # SIGTERM -> app flips /readyz to 503, tells sockets to reconnect with jitter, waits WS_DRAIN_MS, closes. The grace period must exceed
      # preStop sleep + WS_DRAIN_MS + in-flight request time.
      terminationGracePeriodSeconds: 60
      securityContext: { runAsNonRoot: true, runAsUser: 1000, fsGroup: 1000 }
      topologySpreadConstraints:
        - { maxSkew: 1, topologyKey: topology.kubernetes.io/zone, whenUnsatisfiable: DoNotSchedule, labelSelector: { matchLabels: { app: conversations } } }
        - { maxSkew: 1, topologyKey: kubernetes.io/hostname, whenUnsatisfiable: ScheduleAnyway, labelSelector: { matchLabels: { app: conversations } } }
      containers:
        - name: app
          image: conversations:latest   # set via `kustomize edit set image`
          ports: [{ name: http, containerPort: 3000 }]
          envFrom:
            - configMapRef: { name: conversations-config }
            - secretRef: { name: conversations-secrets }
          env:
            - { name: UV_THREADPOOL_SIZE, value: "8" }
            - { name: NODE_OPTIONS, value: "--max-old-space-size=3072" }
            - { name: NODE_ID, valueFrom: { fieldRef: { fieldPath: metadata.name } } }
          resources:
            requests: { cpu: "1", memory: 2Gi }
            limits: { memory: 4Gi }
          startupProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 2, failureThreshold: 30 }
          readinessProbe: { httpGet: { path: /readyz, port: http }, periodSeconds: 3, failureThreshold: 2 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 10, failureThreshold: 3 }
          lifecycle:
            # give the endpoints controller / ingress time to stop sending new connections before SIGTERM starts the drain
            preStop: { exec: { command: ["sleep", "5"] } }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: false, capabilities: { drop: [ALL] } }
