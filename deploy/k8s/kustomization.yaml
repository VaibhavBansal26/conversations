apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: conversations
resources: [namespace.yaml, configmap.yaml, deployment.yaml, service.yaml, hpa.yaml, pdb.yaml, ingress.yaml]
