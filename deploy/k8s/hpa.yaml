apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata: { name: conversations }
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: conversations }
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource: { name: cpu, target: { type: Utilization, averageUtilization: 60 } }
  behavior:
    # sockets are expensive to move: scale up fast, scale down slowly so a night-time dip does not force a reconnect storm
    scaleUp: { stabilizationWindowSeconds: 0, policies: [{ type: Pods, value: 2, periodSeconds: 60 }] }
    scaleDown: { stabilizationWindowSeconds: 600, policies: [{ type: Pods, value: 1, periodSeconds: 300 }] }
