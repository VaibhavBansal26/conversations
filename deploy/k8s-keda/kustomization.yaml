apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../k8s, scaledobject.yaml]
patches:
  - target: { kind: HorizontalPodAutoscaler, name: conversations }
    patch: |-
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata: { name: conversations }
